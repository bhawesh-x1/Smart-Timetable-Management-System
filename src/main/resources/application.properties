# =================================================================================
# SMART CAMPUS TIMETABLE MANAGEMENT SYSTEM (v1.0.0 • College Edition)
# Spring Boot 3.x Configuration (H2 MySQL-Mode Default + Production MySQL Profile)
# =================================================================================

spring.application.name=smart-campus-timetable-system
server.port=8080

# Default Embedded H2 Database in MySQL Compatibility Mode (Zero-Config Startup)
spring.datasource.url=jdbc:h2:mem:piet_smart_campus;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Production MySQL 8.0+ Configuration (Uncomment for live MySQL Server)
# spring.datasource.url=jdbc:mysql://localhost:3306/piet_smart_campus?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf Template Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
